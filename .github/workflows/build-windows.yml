name: Build Windows EXE

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if ((Test-Path requirements.txt) -and ((Get-Item requirements.txt).Length -gt 0)) {
            python -m pip install -r requirements.txt
          }
          python -m pip install pyinstaller pytest

      - name: Run tests
        run: python -m pytest -q

      - name: Build EXE
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name l2tool gui.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: l2tool-windows-exe
          path: dist/l2tool.exe
          if-no-files-found: error

      - name: Upload release asset
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${env:GITHUB_REF_NAME}" 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create "${env:GITHUB_REF_NAME}" --title "${env:GITHUB_REF_NAME}" --notes "Windows build for ${env:GITHUB_REF_NAME}"
          }
          gh release upload "${env:GITHUB_REF_NAME}" dist/l2tool.exe --clobber
