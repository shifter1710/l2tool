# Скопируйте URL настроенного дашборда Grafana. Статические параметры,
# например orgId, окружение и кластер, сохраняются; значения из заявки заменяются.
[services.zapis]
url = "https://grafana.example.local/d/example/find-call-in-logs?orgId=000&var-env=example&var-env_cluster=example"

# Общий URL OpenSearch Discover и представления данных для сервисов.
[opensearch]
base_url = "https://dashboards.example.local/app/data-explorer/discover"

[opensearch.index_patterns]
bff = "bff-example"
myconnect = "myconnect-example"
sip_stack = "sip-stack-example"

# Вставьте одну полную ссылку Grafana Explore из вашего окружения. Она служит
# шаблоном для всех запросов записи и хранится только в локальном config.toml.
[services.recording_explore]
url = ""
