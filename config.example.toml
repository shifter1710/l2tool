# Скопируйте URL настроенного дашборда Grafana. Статические параметры,
# например orgId, окружение и кластер, сохраняются; значения из заявки заменяются.
[services.zapis]
url = "https://grafana.example.local/d/example/find-call-in-logs?orgId=000&var-env=example&var-env_cluster=example"

# Общий URL OpenSearch Discover и представления данных для сервисов.
[opensearch]
base_url = "https://dashboards.example.local/app/data-explorer/discover"

[opensearch.index_patterns]
bff = "bff-example"
myconnect = "myconnect-example"
sip_stack = "sip-stack-example"

# Окно каждой ссылки OpenSearch задаётся в минутах относительно времени звонка.
[services.sip_stack]
minutes_before = 2
minutes_after = 90

[services.bff]
time_from = "now-5d"
time_to = "now"
minutes_before = 2
minutes_after = 90

# В локальном config.toml вставьте полную скопированную ссылку Grafana Explore.
# Реальные ссылки для этих сервисов не храните в Git.
[services.secretary]
url = ""

[services.myconnect]
# Один URL Discover используется и для myconnect, и для myconnect_call.
url = ""
minutes_before = 2
minutes_after = 90

[services.myconnect_call]
minutes_before = 2
minutes_after = 90

[services.noise]
url = ""

# UID Loki datasource для расследования записи. Домен и orgId берутся из
# services.zapis, поэтому вторую полную ссылку Grafana Explore указывать не нужно.
[grafana.recording]
loki_datasource_uid = ""

# Значения по умолчанию для веб-форм и CLI. Все ключи необязательны:
# без них используются встроенные значения.
[defaults]
# Окно поиска в минутах (форма на главной и флаг --window).
window = 60
# Продукт, выбранный в основной форме.
product = "recording"
# Продукт в панели «История звонков из истории баланса».
calls_product = "calls"
# Сколько дней Loki хранит логи — для предупреждения о старых звонках.
loki_retention_days = 5

# Сервисы, которые открывает gtool.py без --open и --product.
[gtool]
default_open = "zapis,bff,myconnect,myconnect_call"

# История звонков из истории баланса (call_history.py и панель на главной).
# Номера Секретаря: звонки, ушедшие на эти номера, помечаются бейджем «Секретарь».
# Список на странице настроек приоритетнее этой секции.
[call_history]
secretary_numbers = []
# Сервисы call_history.py без --open/--product.
default_open = "zapis"
# Максимум звонков в выводе (веб и CLI).
max_calls = 50
